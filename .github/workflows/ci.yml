name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.404
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Restore .NET dependencies
        run: dotnet restore Correntra.sln --locked-mode
      - name: Test .NET
        run: dotnet test Correntra.sln -c Release --no-restore

