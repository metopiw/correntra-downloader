name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.404
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Restore .NET dependencies
        run: dotnet restore Correntra.sln --locked-mode
      - name: Documentation consistency check
        run: powershell -ExecutionPolicy Bypass -File scripts/check-docs.ps1
      - name: Formatting check (dotnet format)
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "$env:PROGRAMFILES\dotnet\sdk" -Directory |
                 Where-Object { $_.Name -like "8.0.*" } |
                 Select-Object -First 1
          if ($sdk) {
            & "$env:PROGRAMFILES\dotnet\dotnet" format Correntra.sln `
              --verify-no-changes --severity warn
          } else {
            Write-Host "::warning::No 8.0.x SDK found; skipping dotnet format check."
          }
      - name: License gate (SBOM + forbidden-license scan)
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\sbom | Out-Null
          dotnet CycloneDX Correntra.sln -o artifacts\sbom --json --exclude-dev
          powershell -ExecutionPolicy Bypass -File scripts/check-licenses.ps1
      - name: Test .NET
        run: dotnet test Correntra.sln -c Release --no-restore
