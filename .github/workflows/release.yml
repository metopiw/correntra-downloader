name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.404
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Build and verify release
        shell: pwsh
        run: ./scripts/release.ps1 -Version '${{ inputs.version }}'
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Correntra Downloader $tag" --notes-file packaging/RELEASE-NOTES-0.1.0.md
          gh release upload $tag release/* --repo $env:GITHUB_REPOSITORY --clobber

