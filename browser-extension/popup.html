<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.35 "Segoe UI", Tahoma, sans-serif; margin: 12px 14px; width: 220px; color: #222; }
    label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    p { margin: 10px 0 0; color: #666; font-size: 11px; }
    #status { margin-top: 8px; font-size: 11px; display: flex; gap: 6px; align-items: center; }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
    #status.online .dot { background: #1a9c5b; }
    #status.offline .dot { background: #d43a3a; }
    #status.online { color: #1a7a4a; }
    #status.offline { color: #a33; }
  </style>
</head>
<body>
  <label>
    <input id="enabled" type="checkbox" checked />
    <span id="label">Capture downloads &amp; videos</span>
  </label>
  <div id="status"><span class="dot"></span><span id="statusText">Checking Correntra…</span></div>
  <p id="hint">Agent must be running on this PC.</p>
  <script src="popup.js"></script>
</body>
</html>
